[package]
name = "data-comparer"
version = "0.3.1-beta.1"
edition = "2021"
description = "Comparador local de salidas SAS y Spark"

[[bin]]
name = "data-comparer"
path = "src/main.rs"

[[bin]]
name = "data-comparer-mcp"
path = "src/bin/data-comparer-mcp.rs"

[dependencies]
anyhow = "1"
arrow-array = "53"
arrow-cast = "53"
arrow-schema = "53"
axum = { version = "0.7", features = ["multipart"] }
blake3 = "1.8.7"
calamine = "0.26"
chardetng = "1.0.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
encoding_rs = "0.8.41"
parquet = { version = "53", features = ["arrow"] }
rayon = "1.12.0"
rust_xlsxwriter = "0.99.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
